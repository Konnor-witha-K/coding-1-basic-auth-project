{% if entries %}
    {% for entry in entries %}
        <div class="entry-card">
            <h3>{{ entry['title'] }}</h3>
            <p>{{ entry['content'] }}</p>
            {% if entry['user'] == 'default' %}
                <p><em>Default entry shown to all users.</em></p>
            {% endif %}
            <p>
                <a href="/edit/{{ entry['id'] }}" class="button">Edit</a>
                |
                <a href="/delete/{{ entry['id'] }}" class="button">Delete</a>
            </p>
        </div>
        <hr>
    {% endfor %}
{% else %}
    <p>No entries yet! Create one to get started.</p>
{% endif %}
